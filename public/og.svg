<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#1a1a1f"/>
      <stop offset="60%" stop-color="#050507"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="moon" cx="35%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#d6d6db"/>
      <stop offset="35%" stop-color="#8e8e93"/>
      <stop offset="70%" stop-color="#3a3a3c"/>
      <stop offset="100%" stop-color="#1c1c1e"/>
    </radialGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c7c7cc"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Moon -->
  <circle cx="980" cy="520" r="320" fill="url(#moon)"/>
  <circle cx="900" cy="440" r="18" fill="#6e6e73" opacity="0.5"/>
  <circle cx="1040" cy="500" r="26" fill="#6e6e73" opacity="0.55"/>
  <circle cx="960" cy="600" r="14" fill="#6e6e73" opacity="0.45"/>

  <!-- Eyebrow -->
  <text x="80" y="170" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="24" font-weight="500" fill="#86868b" letter-spacing="0.5">
    LUNAR WEB ENGINEERING
  </text>

  <!-- Title -->
  <text x="80" y="270" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="-2">
    月面で、Webを
  </text>
  <text x="80" y="370" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="84" font-weight="700" fill="url(#title)" letter-spacing="-2">
    動かすということ。
  </text>

  <!-- Lede -->
  <text x="80" y="450" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="400" fill="#a1a1a6">
    光速。真空。宇宙線。
  </text>
  <text x="80" y="488" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="26" font-weight="400" fill="#a1a1a6">
    3つの物理現象がインフラ設計に何を要求するか。
  </text>

  <!-- URL pill -->
  <rect x="80" y="540" width="380" height="48" rx="24" fill="#0071e3"/>
  <text x="270" y="572" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="22" font-weight="500" fill="#ffffff" text-anchor="middle">
    space-web-engineering.com
  </text>
</svg>
